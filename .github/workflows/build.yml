# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: main
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shouldPublish:
        description: 'Should the mod be published'
        required: true
        type: boolean

jobs:
  main:
    permissions:
      contents: write
    environment: mc-publish
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: Publish
        id: publish
        uses: Kira-NT/mc-publish@v3.3.1
        if: "
          (github.event_name == 'workflow_dispatch' && github.event.inputs.shouldPublish) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]'))"

        with:
          changelog-file: CHANGELOG.md

          modrinth-id: OcdK0BUX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1707125
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
